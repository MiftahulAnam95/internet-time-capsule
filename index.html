<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Internet Time Capsule — an interactive digital museum archiving the websites, technologies, games and digital cultures that shaped the connected world, 1989 to today."
    />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://commons.wikimedia.org" />
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23191919'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23f5f2ea' text-anchor='middle'%3EI%3C/text%3E%3Crect x='0' y='28' width='32' height='4' fill='%23d94a38'/%3E%3C/svg%3E"
    />
    <title>Internet Time Capsule — A Digital Museum of Internet History</title>
    <style>
      /* Critical shell: paints the archive background instantly so first paint
         is never a blank white page, even before the bundle loads. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f2ea;
      }
      .itc-boot {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
        color: #191919;
        background-image: linear-gradient(to right, #d8d4ca55 1px, transparent 1px),
          linear-gradient(to bottom, #d8d4ca55 1px, transparent 1px);
        background-size: 88px 88px;
      }
      .itc-boot-kicker {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.625rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8b8982;
        margin: 0 0 1rem;
      }
      .itc-boot-kicker i {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #d94a38;
        margin-right: 0.6rem;
        font-style: normal;
        animation: itc-blink 1.4s steps(1, end) infinite;
      }
      .itc-boot-title {
        font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.2rem, 7vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.015em;
        margin: 0;
      }
      .itc-boot-bar {
        width: min(22rem, 70vw);
        height: 2px;
        background: #d8d4ca;
        margin: 2rem 0 1rem;
        overflow: hidden;
        position: relative;
      }
      .itc-boot-bar span {
        position: absolute;
        inset: 0;
        width: 33%;
        background: #d94a38;
        animation: itc-scan 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }
      .itc-boot-sub {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.625rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b8982;
        margin: 0;
      }
      #itc-boot-help {
        display: none;
        margin-top: 2rem;
        max-width: 26rem;
        border: 1px solid #d8d4ca;
        background: #fbf9f4;
        padding: 1.25rem 1.5rem;
      }
      #itc-boot-help p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #2b2b29;
        margin: 0 0 1rem;
      }
      #itc-boot-help button {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        background: #191919;
        color: #fbf9f4;
        border: 1px solid #191919;
        padding: 0.8rem 1.25rem;
        cursor: pointer;
      }
      @keyframes itc-scan {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @keyframes itc-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .itc-boot-bar span,
        .itc-boot-kicker i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot placeholder: visible instantly, replaced by React on mount.
           If the bundle never runs, this (and the help box below) is what the
           visitor sees — never a blank white page. -->
      <div class="itc-boot">
        <p class="itc-boot-kicker"><i></i>Arsip digital / Digital archive · Vol. 001</p>
        <h1 class="itc-boot-title">Internet Time Capsule</h1>
        <div class="itc-boot-bar" aria-hidden="true"><span></span></div>
        <p class="itc-boot-sub">Memuat arsip… · Loading the archive…</p>
        <div id="itc-boot-help">
          <p>
            Arsip tidak dapat dimuat. Periksa koneksi internet Anda lalu muat ulang halaman ini.
            <br />
            The archive could not be loaded. Check your connection, then reload this page.
          </p>
          <button type="button" onclick="window.location.reload()">Muat ulang · Reload</button>
        </div>
      </div>
      <noscript>
        <div style="max-width:32rem;margin:0 auto;padding:2rem;text-align:center;font-family:Georgia,serif;">
          <p>Internet Time Capsule membutuhkan JavaScript untuk menampilkan arsip interaktif.<br />Internet Time Capsule needs JavaScript to display the interactive archive.</p>
        </div>
      </noscript>
    </div>
    <script>
      // Adopt the visitor's saved language before React mounts, so the
      // document shell matches on first paint.
      try {
        var l = window.localStorage.getItem("itc:lang:v1");
        if (l !== "id" && l !== "en") {
          l =
            navigator.language && navigator.language.toLowerCase().indexOf("id") === 0
              ? "id"
              : "en";
        }
        document.documentElement.lang = l;
        if (l === "id") {
          document.title = "Internet Time Capsule — Museum Digital Sejarah Internet";
        }
      } catch (e) {
        /* storage unavailable — the app still boots in English */
      }
      // If the bundle never executes (blocked network, old browser, failed
      // deploy), surface the recovery box instead of a perpetual loader.
      window.setTimeout(function () {
        if (!window.__ITC_MOUNTED) {
          var help = document.getElementById("itc-boot-help");
          if (help) help.style.display = "block";
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
